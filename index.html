<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little surprise 🤍</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, "Times New Roman", serif;
  color: #fff;
  overflow: hidden;
  transition: background 1s ease;
}

/* Different backgrounds for each stage */
body.s1 {
  background: linear-gradient(135deg, #5b617a, #9a8195);
}

body.s2 {
  background: linear-gradient(135deg, #493c68, #b06b91);
}

body.s3 {
  background: linear-gradient(135deg, #24243e, #7b4b78, #d17b9a);
}

.card {
  width: min(90%, 440px);
  padding: 44px 28px;
  text-align: center;
  background: rgba(255,255,255,0.13);
  border: 1px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  border-radius: 30px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.2);
}

.emoji {
  font-size: 34px;
  margin-bottom: 10px;
}

h1 {
  font-size: 29px;
  font-weight: 500;
  margin: 0 0 14px;
}

p {
  line-height: 1.75;
}

.sub {
  opacity: 0.85;
  margin-bottom: 28px;
}

button {
  border: 0;
  padding: 14px 28px;
  border-radius: 999px;
  background: #fff;
  color: #57465f;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 7px 20px rgba(0,0,0,0.15);
  transition: 0.2s;
}

button:active {
  transform: scale(0.95);
}

.screen {
  display: none;
  animation: appear 0.7s ease;
}

.screen.active {
  display: block;
}

#message {
  text-align: left;
  margin-top: 20px;
}

.heart {
  text-align: center;
  font-size: 25px;
  margin-top: 20px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body class="s1">

<main class="card">

  <!-- First page -->
  <section class="screen active" id="s1">

    <h
